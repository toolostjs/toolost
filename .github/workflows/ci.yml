name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Style Gate (Prettier)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: ci

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check lint, then apply Prettier fixes if needed
        id: prettier
        shell: bash
        run: |
          set -euo pipefail

          if pnpm -w run lint; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm -w run format

          if git diff --quiet; then
            echo "::error::Lint failed but Prettier produced no changes."
            exit 1
          fi

          pnpm -w run lint
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update branded Prettier PR
        if: steps.prettier.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: apply prettier formatting"
          branch: "automation/prettier-format"
          delete-branch: true
          title: "🎨 style: apply Prettier formatting"
          body: |
            ## 🎨 Automated Prettier Formatting

            This pull request was created automatically by **Stoneclane Studios CI**.

            ### Changes
            - Applied Prettier formatting
            - Re-ran the style gate successfully

            ### Automation
            This PR is safe to auto-merge once required checks pass.
          labels: |
            automated
            prettier
            style
            ci
          assignees: ${{ github.repository_owner }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Enable auto-merge for Prettier PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    environment: ci

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
